<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#17191f"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><title>Alma — Afirmaciones</title><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.2/cropper.min.css"><link rel="stylesheet" href="style.css?v=20260923-16"><style>.crop-editor{display:none;position:absolute;inset:0;z-index:100;background:#111318;color:#fff;flex-direction:column}.crop-editor.open{display:flex}.crop-head{height:68px;display:flex;align-items:center;justify-content:space-between;padding:12px 18px}.crop-head strong{font-size:16px}.crop-head button,.crop-actions button{border:0;color:#fff;background:#ffffff18;border-radius:12px;padding:10px 14px}.crop-head .apply{background:#fff;color:#17191f;font-weight:700}.crop-stage{flex:1;min-height:0;background:#08090b;display:flex;align-items:center;justify-content:center}.crop-stage img{display:block;max-width:100%;max-height:100%}.crop-actions{height:82px;display:flex;align-items:center;justify-content:center;gap:12px;padding-bottom:env(safe-area-inset-bottom)}.crop-actions button{display:flex;align-items:center;gap:7px}.crop-actions svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.crop-stage{touch-action:none}.cropper-point{width:16px!important;height:16px!important;opacity:1!important}.cropper-point.point-nw,.cropper-point.point-ne,.cropper-point.point-sw,.cropper-point.point-se{width:22px!important;height:22px!important}.cropper-line{opacity:.65!important}.crop-actions{overflow-x:auto;justify-content:flex-start;padding-left:12px;padding-right:12px}.crop-actions button{flex:0 0 auto;min-height:44px}</style></head><body><main id="app"><section id="home" class="screen active"><div id="hero" class="hero"><div class="overlay"></div><header class="top">< uina</option><option value="rounded">Redondeada</option><option value="bold">Impacto</option></select></label><label>Color del texto<div id="colorSwatches" class="swatches"><button data-color="#ffffff" style="--c:#fff"></button><button data-color="#17191f" style="--c:#17191f"></button><button data-color="#ffe8d7" style="--c:#ffe8d7"></button><button data-color="#ffd1dc" style="--c:#ffd1dc"></button><button data-color="#e7dcff" style="--c:#e7dcff"></button><button data-color="#cdefff" style="--c:#cdefff"></button><button data-color="#d7f5df" style="--c:#d7f5df"></button><button data-color="#fff1a8" style="--c:#fff1a8"></button></div><div class="custom-color">Color personalizado <input id="colorPicker" type="color" value="#ffffff"></div></label><label>Tamaño del texto<input id="sizeRange" type="range" min="28" max="54" value="42"></label><label>Alineación<div class="align-row"><button type="button" data-align="left">Izq.</button><button type="button" data-align="center">Centro</button><button type="button" data-align="right">Der.</button></div></label></div></section><nav class="bottom"><button data-open="home" class="selected"><b><svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1v-9z"/></svg></b><span>Inicio</span></button><button data-open="create"><b><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></b><span>Crear</span></button><button data-open="settings"><b><svg viewBox="0 0 24 24"><path d="M12 3l1.5 4.5L18 9l-4.5 1.5L12 15l-1.5-4.5L6 9l4.5-1.5L12 3zM19 15l.8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8L19 15z"/></svg></b><span>Personalizar</span></button></nav><div id="cropEditor" class="crop-editor"><div class="crop-head"><button id="cropCancel">Cancelar</button><strong>Editar imagen</strong><button id="cropApply" class="apply">Listo</button></div><div class="crop-stage"><img id="cropImage" alt="Imagen para recortar"></div><div class="crop-actions"><button id="cropReset">Reiniciar</button><button id="zoomOut" aria-label="Alejar">−</button><button id="zoomIn" aria-label="Acercar">+</button><button id="rotateLeft"><svg viewBox="0 0 24 24"><path d="M4 7v5h5M5 12a7 7 0 1 0 2-5"/></svg>Girar izq.</button><button id="rotateRight"><svg viewBox="0 0 24 24"><path d="M20 7v5h-5M19 12a7 7 0 1 1-2-5"/></svg>Girar der.</button></div></div><div id="toast" class="toast"></div></main><script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.2/cropper.min.js"></script><script src="app.js?v=20260923-16"></script></body></html>
