<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#17191f"><title>Alma — Afirmaciones</title><link rel="stylesheet" href="style.css"></head><body><main id="app"><section id="home" class="screen active"><div id="hero" class="hero"><div class="overlay"></div><header class="top"><button class="glass" data-open="categories">☰</button><div class="brand">ALMA<small id="categoryLabel">Para ti</small></div><button class="glass" data-open="settings">✦</button></header><div class="quote-wrap"><span id="quoteCategory" class="pill"></span><h1 id="quoteText"></h1><p class="swipe-hint">Desliza para descubrir otra</p></div><div class="side-actions"><button id="favoriteBtn" class="round">♡</button><button id="shareBtn" class="round">↗</button></div><div class="progress"><span id="counter"></span><div><i id="progressBar"></i></div></div></div></section><section id="categories" class="screen panel"><header class="panel-head"><button class="back">‹</button><div><small>Explora</small><h2>Categorías</h2></div></header><div id="categoryGrid" class="category-grid"></div></section><section id="favorites" class="screen panel"><header class="panel-head"><button class="back">‹</button><div><small>Tu colección</small><h2>Favoritos</h2></div></header><div id="favoriteList" class="cards"></div></section><section id="create" class="screen panel"><header class="panel-head"><button class="back">‹</button><div><small>Hazla tuya</small><h2>Nueva afirmación</h2></div></header><div class="form-card"><label>Tu frase<textarea id="newText" maxlength="180" placeholder="Escribe algo que quieras recordar cada día..."></textarea></label><label>Categoría<select id="newCategory"></select></label><label class="image-pick">＋ Agregar una imagen<input id="newImage" type="file" accept="image/*"></label><div id="imagePreviewBox" class="image-preview"><img id="imagePreview" alt=""></div><button id="saveBtn" class="cta">Guardar afirmación</button></div></section><section id="settings" class="screen panel"><header class="panel-head"><button class="back">‹</button><div><small>Tu espacio</small><h2>Personalizar</h2></div></header><div id="settingsPreview" class="mini-preview"><span>Vista previa</span><strong>Estoy creando una vida que se siente como mía.</strong></div><div class="settings-card"><label>Ambiente<select id="backgroundSelect"><option value="dawn">Amanecer</option><option value="ocean">Océano</option><option value="forest">Bosque</option><option value="night">Noche</option><option value="rose">Rosa</option></select></label><label>Tipografía<select id="fontSelect"><option value="serif">Editorial</option><option value="sans">Moderna</option><option value="soft">Suave</option></select></label><label>Color del texto<input id="colorPicker" type="color" value="#ffffff"></label></div></section><nav class="bottom"><button data-open="home" class="selected"><b>⌂</b><span>Inicio</span></button><button data-open="categories"><b>⌘</b><span>Explorar</span></button><button data-open="favorites"><b>♡</b><span>Favoritos</span></button><button data-open="create"><b>＋</b><span>Crear</span></button></nav><div id="toast" class="toast"></div></main><script src="app.js"></script></body></html>
